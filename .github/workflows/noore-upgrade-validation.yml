name: NOORE upgrade validation

on:
  push:
    branches:
      - feature/complete-ecommerce-upgrade
  pull_request:
    branches:
      - main

concurrency:
  group: noore-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/noore_test?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-noore-test-secret-keep-out-of-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-anon-key
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma
      - name: Build application
        run: npm run build
