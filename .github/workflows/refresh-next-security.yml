name: Refresh patched Next.js dependency

on:
  push:
    branches:
      - security/stabilization-2026-11-25
    paths:
      - .github/workflows/refresh-next-security.yml

permissions:
  contents: read

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out security branch without a persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/stabilization-2026-11-25
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Update Next.js to the latest patched 15.x maintenance release
        run: npm install --package-lock-only --ignore-scripts --save-exact next@15.5.29

      - name: Install the exact lockfile
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Type-check the application
        run: npx tsc --noEmit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload the reviewed dependency manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-security-lockfiles
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

  commit-lockfiles:
    needs: refresh-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out security branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/stabilization-2026-11-25

      - name: Download validated dependency manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: next-security-lockfiles

      - name: Commit dependency update
        env:
          BRANCH_NAME: security/stabilization-2026-11-25
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency manifests already match the patched release."
            exit 0
          fi
          git commit -m "security: upgrade Next.js to patched 15.5.29"
          git push origin "HEAD:${BRANCH_NAME}"
