
name: Diagnose and inspect NOORE Neon database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noore-database-migration
  cancel-in-progress: false

jobs:
  inspect-neon-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OLD_DATABASE_URL: ${{ secrets.OLD_DATABASE_URL }}

    steps:
      - name: Check Neon secret
        shell: bash
        run: |
          set -euo pipefail

          test -n "$OLD_DATABASE_URL" || {
            echo "OLD_DATABASE_URL secret is missing"
            exit 1
          }

          echo "Neon database secret is configured."

      - name: Inspect all Neon schemas and tables
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/noore-diagnostics"

          docker run --rm \
            -e OLD_DATABASE_URL \
            -v "$RUNNER_TEMP/noore-diagnostics:/report" \
            postgres:18 \
            bash -ceu '

              REPORT=/report/neon-database-report.txt

              echo "====================================" | tee "$REPORT"
              echo "NOORE NEON DATABASE DIAGNOSTIC REPORT" | tee -a "$REPORT"
              echo "====================================" | tee -a "$REPORT"

              echo "" | tee -a "$REPORT"
              echo "1. DATABASE CONNECTION INFORMATION" | tee -a "$REPORT"

              psql "$OLD_DATABASE_URL" \
                -v ON_ERROR_STOP=1 \
                -P pager=off \
                -c "
                  SELECT
                    current_database() AS database_name,
                    current_user AS database_user,
                    current_schema() AS current_schema,
                    current_schemas(true) AS search_path,
                    version() AS postgres_version;
                " | tee -a "$REPORT"

              echo "" | tee -a "$REPORT"
              echo "2. ALL AVAILABLE SCHEMAS" | tee -a "$REPORT"

              psql "$OLD_DATABASE_URL" \
                -v ON_ERROR_STOP=1 \
                -P pager=off \
                -c "
                  SELECT
                    schema_name
                  FROM information_schema.schemata
                  ORDER BY schema_name;
                " | tee -a "$REPORT"

              echo "" | tee -a "$REPORT"
              echo "3. ALL USER TABLES ACROSS ALL SCHEMAS" | tee -a "$REPORT"

              psql "$OLD_DATABASE_URL" \
                -v ON_ERROR_STOP=1 \
                -P pager=off \
                -c "
                  SELECT
                    schemaname AS schema_name,
                    relname AS table_name,
                    n_live_tup AS estimated_records
                  FROM pg_stat_user_tables
                  ORDER BY schemaname, relname;
                " | tee -a "$REPORT"

              echo "" | tee -a "$REPORT"
              echo "4. TABLE COUNTS BY SCHEMA" | tee -a "$REPORT"

              psql "$OLD_DATABASE_URL" \
                -v ON_ERROR_STOP=1 \
                -P pager=off \
                -c "
                  SELECT
                    schemaname AS schema_name,
                    count(*) AS table_count
                  FROM pg_tables
                  WHERE schemaname NOT IN (
                    '\''pg_catalog'\'',
                    '\''information_schema'\''
                  )
                  GROUP BY schemaname
                  ORDER BY schemaname;
                " | tee -a "$REPORT"

              echo "" | tee -a "$REPORT"
              echo "5. ALL NON-SYSTEM DATABASE OBJECTS" | tee -a "$REPORT"

              psql "$OLD_DATABASE_URL" \
                -v ON_ERROR_STOP=1 \
                -P pager=off \
                -c "
                  SELECT
                    n.nspname AS schema_name,
                    c.relname AS object_name,
                    CASE c.relkind
                      WHEN '\''r'\'' THEN '\''TABLE'\''
                      WHEN '\''p'\'' THEN '\''PARTITIONED TABLE'\''
                      WHEN '\''v'\'' THEN '\''VIEW'\''
                      WHEN '\''m'\'' THEN '\''MATERIALIZED VIEW'\''
                      WHEN '\''f'\'' THEN '\''FOREIGN TABLE'\''
                      ELSE c.relkind::text
                    END AS object_type
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname NOT IN (
                    '\''pg_catalog'\'',
                    '\''information_schema'\''
                  )
                  AND c.relkind IN (
                    '\''r'\'', '\''p'\'', '\''v'\'', '\''m'\'', '\''f'\''
                  )
                  ORDER BY n.nspname, c.relname;
                " | tee -a "$REPORT"

              echo "" | tee -a "$REPORT"
              echo "6. DIAGNOSTIC COMPLETED" | tee -a "$REPORT"

              echo "Report saved successfully."
              ls -lh "$REPORT"

            '

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: noore-neon-diagnostic-report
          path: ${{ runner.temp }}/noore-diagnostics/neon-database-report.txt
          retention-days: 7
          if-no-files-found: error

      - name: Finish
        run: echo "Neon diagnostic completed. No database changes were made."
